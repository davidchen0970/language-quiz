name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - english_toeic
      - korean_topik
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, validate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main
          fetch-depth: 1

      - name: Checkout English TOEIC branch
        uses: actions/checkout@v4
        with:
          ref: english_toeic
          path: site-english
          fetch-depth: 1

      - name: Checkout Korean TOPIK branch
        uses: actions/checkout@v4
        with:
          ref: korean_topik
          path: site-korean
          fetch-depth: 1

      - name: Show checked-out branch information
        shell: bash
        run: |
          set -euo pipefail

          for item in \
            "site-main:main" \
            "site-english:english_toeic" \
            "site-korean:korean_topik"
          do
            directory="${item%%:*}"
            expected_branch="${item##*:}"

            echo "============================================================"
            echo "Directory: ${directory}"
            echo "Expected branch: ${expected_branch}"
            echo "Commit: $(git -C "${directory}" rev-parse HEAD)"
            echo "Commit message: $(git -C "${directory}" log -1 --pretty=%s)"
            echo "Files:"

            find "${directory}" \
              -maxdepth 3 \
              -type f \
              -not -path '*/.git/*' \
              | sort \
              | sed -n '1,160p'
          done

      # Generate manifest.json in both quiz branches before publishing.
      - name: Generate chapter manifests
        shell: bash
        run: |
          set -euo pipefail

          for site_dir in site-english site-korean; do
            echo "============================================================"
            echo "Generating manifest for ${site_dir}"

            generator="${site_dir}/tools/generate_manifest.py"
            chapter_dir="${site_dir}/src/data/chapters"
            manifest="${chapter_dir}/manifest.json"

            test -f "${generator}"
            test -d "${chapter_dir}"

            python3 "${generator}"

            test -f "${manifest}"

            echo "Generated manifest:"
            cat "${manifest}"
            echo
          done

      # Verify that each manifest matches the chapter JavaScript files.
      - name: Validate generated manifests
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          sites = {
              "English TOEIC": Path("site-english"),
              "Korean TOPIK": Path("site-korean"),
          }

          for site_name, site_root in sites.items():
              chapter_dir = site_root / "src" / "data" / "chapters"
              manifest_path = chapter_dir / "manifest.json"

              expected_files = sorted(
                  path.name
                  for path in chapter_dir.glob("*.js")
                  if path.is_file()
              )

              with manifest_path.open("r", encoding="utf-8") as file:
                  manifest_files = json.load(file)

              if not isinstance(manifest_files, list):
                  raise SystemExit(
                      f"{manifest_path} must contain a JSON array."
                  )

              if manifest_files != expected_files:
                  raise SystemExit(
                      f"{site_name} manifest does not match chapter files.\n"
                      f"Expected: {expected_files}\n"
                      f"Actual:   {manifest_files}"
                  )

              print(
                  f"{site_name}: validated {manifest_path} "
                  f"with {len(manifest_files)} chapter file(s)."
              )
          PY

      - name: Prepare publish folder
        shell: bash
        run: |
          set -euo pipefail

          rm -rf publish
          mkdir -p publish/english_toeic
          mkdir -p publish/korean_topik

          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            site-main/ publish/

          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='src/styles.css' \
            site-english/ publish/english_toeic/

          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='src/styles.css' \
            site-korean/ publish/korean_topik/

          touch publish/.nojekyll

          echo "Published file tree:"
          find publish \
            -maxdepth 5 \
            -type f \
            | sort \
            | sed -n '1,260p'

      # main/src/styles.css is the only stylesheet deployed to every page.
      - name: Force shared stylesheet from main
        shell: bash
        run: |
          set -euo pipefail

          style_source="site-main/src/styles.css"
          test -f "${style_source}"

          for quiz_dir in english_toeic korean_topik; do
            style_target="publish/${quiz_dir}/src/styles.css"
            mkdir -p "$(dirname "${style_target}")"
            rm -f "${style_target}"
            cp "${style_source}" "${style_target}"
            cmp --silent "${style_source}" "${style_target}"
            echo "main/src/styles.css -> ${style_target}"
          done

      - name: Add stylesheet cache version
        shell: bash
        env:
          STYLE_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["STYLE_VERSION"]
          pages = [
              Path("publish/english_toeic/index.html"),
              Path("publish/korean_topik/index.html"),
          ]

          for page in pages:
              source = page.read_text(encoding="utf-8")
              stylesheet = f'<link rel="stylesheet" href="src/styles.css?v={version}">'

              # Accept src/styles.css, ./src/styles.css, and an existing ?v value.
              updated, count = re.subn(
                  r'<link\s+[^>]*rel=["\']stylesheet["\'][^>]*href=["\'](?:\./)?src/styles\.css(?:\?v=[^"\']*)?["\'][^>]*>',
                  stylesheet,
                  source,
                  count=1,
                  flags=re.IGNORECASE,
              )

              if count == 0:
                  # Older main/index.html stored its CSS inline. Remove that block
                  # on the landing page, then add the shared stylesheet to <head>.
                  if page == Path("publish/index.html"):
                      updated = re.sub(
                          r'\s*<style>.*?</style>',
                          '',
                          source,
                          count=1,
                          flags=re.IGNORECASE | re.DOTALL,
                      )
                  else:
                      updated = source

                  if re.search(r'</head>', updated, flags=re.IGNORECASE) is None:
                      raise SystemExit(f"Closing </head> not found in {page}")

                  updated = re.sub(
                      r'</head>',
                      f'  {stylesheet}\n</head>',
                      updated,
                      count=1,
                      flags=re.IGNORECASE,
                  )

              page.write_text(updated, encoding="utf-8")
              print(f"Shared stylesheet enabled in {page}")
          PY

      - name: Normalize quiz runtime
        shell: bash
        run: |
          set -euo pipefail

          for quiz_dir in english_toeic korean_topik; do
            loader_source="site-main/src/chapter-loader.js"
            loader_target="publish/${quiz_dir}/src/chapter-loader.js"
            app_file="publish/${quiz_dir}/src/app.js"

            test -f "${loader_source}"
            test -f "${app_file}"

            # Keep the loader identical across quiz pages.
            cp "${loader_source}" "${loader_target}"

            # Namespace localStorage by path to isolate quiz state.
            python3 - "${app_file}" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          old = "const storageKey = 'genericQuizState';"
          new = "const storageKey = `genericQuizState:${location.pathname.replace(/\\/$/, '') || '/'}`;"

          if old not in source:
              raise SystemExit(
                  f"Expected storage key declaration not found in {path}"
              )

          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          done

      # Verify the manifests after all files are copied to publish.
      - name: Validate published manifests
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          for quiz_dir in ("english_toeic", "korean_topik"):
              chapter_dir = (
                  Path("publish")
                  / quiz_dir
                  / "src"
                  / "data"
                  / "chapters"
              )
              manifest_path = chapter_dir / "manifest.json"

              if not manifest_path.is_file():
                  raise SystemExit(
                      f"Published manifest was not found: {manifest_path}"
                  )

              actual_files = sorted(
                  path.name
                  for path in chapter_dir.glob("*.js")
                  if path.is_file()
              )

              with manifest_path.open("r", encoding="utf-8") as file:
                  manifest_files = json.load(file)

              if manifest_files != actual_files:
                  raise SystemExit(
                      f"Published manifest is inconsistent: {manifest_path}\n"
                      f"Expected: {actual_files}\n"
                      f"Actual:   {manifest_files}"
                  )

              print(
                  f"Validated {manifest_path} "
                  f"with {len(manifest_files)} chapter file(s)."
              )
          PY

      - name: Validate shared stylesheet
        shell: bash
        run: |
          set -euo pipefail

          for target in \
            publish/src/styles.css \
            publish/english_toeic/src/styles.css \
            publish/korean_topik/src/styles.css
          do
            cmp --silent site-main/src/styles.css "${target}"
            echo "Verified main stylesheet: ${target}"
          done

      - name: Validate published JavaScript
        shell: bash
        run: |
          set -euo pipefail

          for quiz_dir in english_toeic korean_topik; do
            node --check "publish/${quiz_dir}/src/chapter-loader.js"
            node --check "publish/${quiz_dir}/src/app.js"
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "deploy: ${{ github.sha }}"
