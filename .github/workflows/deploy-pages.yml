name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - english_toeic
      - korean_topik
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout english_toeic
        uses: actions/checkout@v4
        with:
          ref: english_toeic
          path: site-english

      - name: Checkout korean_topik
        uses: actions/checkout@v4
        with:
          ref: korean_topik
          path: site-korean

      - name: Prepare publish folder
        run: |
          rm -rf publish
          mkdir -p publish
          mkdir -p publish/english_toeic
          mkdir -p publish/korean_topik

          rsync -av --exclude='.git' --exclude='.github' site-main/ publish/
          rsync -av --exclude='.git' --exclude='.github' site-english/ publish/english_toeic/
          rsync -av --exclude='.git' --exclude='.github' site-korean/ publish/korean_topik/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          
