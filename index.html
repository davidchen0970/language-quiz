<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>測驗網站</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #0f172a;
    }

    main {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px rgba(0, 0, 0, 0.1);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .icon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: #eff6ff;
      border-radius: 16px;
      font-size: 28px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #64748b;
      font-size: 15px;
      line-height: 1.5;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      color: #ffffff;
      text-decoration: none;
      border-radius: 18px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .link-button:hover {
      transform: translateY(-3px);
    }

    .english {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.35);
    }

    .english:hover {
      box-shadow: 0 12px 24px -4px rgba(37, 99, 235, 0.45);
    }

    .korean {
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      box-shadow: 0 8px 20px -4px rgba(139, 92, 246, 0.35);
    }

    .korean:hover {
      box-shadow: 0 12px 24px -4px rgba(139, 92, 246, 0.45);
    }

    .button-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .button-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .button-description {
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-weight: 400;
    }

    .arrow-icon {
      font-size: 20px;
      transition: transform 0.2s ease;
    }

    .link-button:hover .arrow-icon {
      transform: translateX(4px);
    }

    .link-button:focus-visible {
      outline: 3px solid #fbbf24;
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <main>
    <div class="header">
      <div class="icon-badge">📝</div>
      <h1>語言能力測驗中心</h1>
      <p class="subtitle">請選擇您要進行的語言檢定題庫</p>
    </div>

    <div class="links">
      <a href="./english_toeic/" class="link-button english">
        <div class="button-content">
          <span class="button-title">🇺🇸 英文 TOEIC 題庫</span>
          <span class="button-description">前往多益聽力與閱讀模擬檢定</span>
        </div>
        <span class="arrow-icon">→</span>
      </a>

      <a href="./korean_topik/" class="link-button korean">
        <div class="button-content">
          <span class="button-title">🇰🇷 韓文 TOPIK 測驗</span>
          <span class="button-description">前往韓國語能力考試模擬檢定</span>
        </div>
        <span class="arrow-icon">→</span>
      </a>
    </div>
  </main>
</body>
</html>
